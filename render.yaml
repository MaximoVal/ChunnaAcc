# ========================================================
# RENDER BLUEPRINT - CHUNNA ACCESORIOS (FULLSTACK)
# Despliega Frontend (React/Vite) + Backend (Node/Express/Sequelize)
# en un único Web Service en Render
# ========================================================
services:
  - type: web
    name: chunna-accesorios
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 365d
      - key: ADMIN_EMAIL
        value: cunna.accs@gmail.com
      # Opción 1: Conexión directa mediante URL (Recomendado para Aiven, Railway, TiDB, Clever Cloud, etc.)
      - key: DATABASE_URL
        sync: false
      # Opción 2: Variables individuales (usadas si DATABASE_URL no está definida)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: chunna_db
      - key: DB_SSL
        value: "true"
      # Servicio de Correo Oficial: Resend API (HTTP REST vía HTTPS - 100% compatible con Render)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Chunna Accesorios <onboarding@resend.dev>
      # Inteligencia Artificial Google Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      # Integración Meta / Instagram (Opcional)
      - key: META_VERIFY_TOKEN
        value: chunna_meta_webhook_token_2026
      - key: PAGE_ACCESS_TOKEN
        sync: false
