# ========================================================
# RENDER BLUEPRINT - CHUNNA ACCESORIOS (FULLSTACK)
# Despliega Frontend (React/Vite) + Backend (Node/Express/Sequelize)
# en un único Web Service en Render
# ========================================================
services:
  - type: web
    name: chunna-accesorios
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: cunna.accs@gmail.com
      # Opción 1: Conexión directa mediante URL (Recomendado para Aiven, Railway, TiDB, etc.)
      - key: DATABASE_URL
        sync: false
      # Opción 2: Variables individuales (usadas si DATABASE_URL no está definida)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: chunna_db
      - key: DB_SSL
        value: "true"
      # Inteligencia Artificial Google Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      # Integración Meta / Instagram (Opcional)
      - key: META_VERIFY_TOKEN
        value: chunna_meta_webhook_token_2026
      - key: PAGE_ACCESS_TOKEN
        sync: false
      # Configuración de Correo Electrónico (2FA para Administrador)
      # Método A: Gmail SMTP (Requiere Contraseña de Aplicación de 16 letras)
      - key: EMAIL_USER
        value: cunna.accs@gmail.com
      - key: EMAIL_PASS
        sync: false
      # Método B (Alternativa Ultra-Confiable HTTP REST en Render): Resend API
      - key: RESEND_API_KEY
        sync: false
